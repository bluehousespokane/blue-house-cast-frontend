name: Blue House Cast checks and upstream sync

on:
  push:
    branches: [blue-house, blue-house-cast-splash-ha-20260930-4]
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: Merge the latest published upstream frontend release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blue-house-cast-source-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max_old_space_size=6144
  SKIP_FETCH_NIGHTLY_TRANSLATIONS: "1"

jobs:
  receiver:
    if: github.repository == 'bluehousespokane/blue-house-cast-frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify the dispatched revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare candidate upstream merge
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_UPSTREAM: ${{ github.event_name == 'schedule' || inputs.sync_upstream == true }}
        shell: bash
        run: |
          set -euo pipefail
          echo "check=true" >> "$GITHUB_OUTPUT"
          echo "updated=false" >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$SYNC_UPSTREAM" != true ]]; then
            exit 0
          fi
          release=$(gh api repos/home-assistant/frontend/releases/latest --jq .tag_name)
          [[ "$release" =~ ^[0-9]{8}\.[0-9]+$ ]]
          git remote add upstream https://github.com/home-assistant/frontend.git
          git fetch --no-tags upstream "refs/tags/$release:refs/tags/$release"
          if git merge-base --is-ancestor "$release" HEAD; then
            echo "check=false" >> "$GITHUB_OUTPUT"
            echo "Upstream $release is already included." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! git merge --no-edit "$release"; then
            git merge --abort
            echo "::error::Upstream $release conflicts with this fork; manual review is required."
            exit 1
          fi
          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "Candidate merge: upstream $release" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Node
        if: steps.upstream.outputs.check == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up pnpm
        if: steps.upstream.outputs.check == 'true'
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install upstream dependencies
        if: steps.upstream.outputs.check == 'true'
        run: pnpm install --frozen-lockfile
      - name: Check customized source
        if: steps.upstream.outputs.check == 'true'
        run: |
          node blue-house/loading_screen.test.mjs
          pnpm exec prettier --check cast/src/html/_loading_particles.js cast/src/html/_loading_screen.js cast/src/receiver/entrypoint.ts cast/src/receiver/layout/hc-launch-screen.ts cast/src/receiver/layout/hc-main.ts cast/src/receiver/layout/hc-lovelace.ts cast/src/receiver/view_ready.ts test/cast/view_ready.test.ts src/cast/const.ts src/cast/receiver_messages.ts src/cast/sender_messages.ts blue-house/loading_screen.test.mjs blue-house/README.md .github/workflows/blue_house_cast.yaml
          pnpm exec prettier --parser html --check cast/src/html/receiver.html.template
          pnpm exec eslint cast/src/receiver/entrypoint.ts cast/src/receiver/layout/hc-launch-screen.ts cast/src/receiver/layout/hc-main.ts cast/src/receiver/layout/hc-lovelace.ts cast/src/receiver/view_ready.ts test/cast/view_ready.test.ts src/cast/const.ts src/cast/receiver_messages.ts src/cast/sender_messages.ts
          pnpm test test/cast/
      - name: Build the upstream Cast target
        if: steps.upstream.outputs.check == 'true'
        run: |
          pnpm exec gulp build-cast
          test -s cast/dist/receiver.html
          test -d cast/dist/frontend_latest
          python3 blue-house/check_receiver_artifact.py cast/dist/receiver.html
          pnpm exec gulp gather-gallery-pages
          pnpm lint:types
          git diff --exit-code
      - name: Accept validated upstream merge
        if: steps.upstream.outputs.updated == 'true'
        run: |
          git push origin HEAD:blue-house
          echo "Validated fork commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Record validation for the exact fork commit
        if: steps.upstream.outputs.check == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state=success \
            -f context=blue-house-cast/build \
            -f description='Cast checks and production build passed' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
